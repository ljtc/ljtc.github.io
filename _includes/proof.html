
<details class="math-proof"
  {% if include.open %}open{% endif %}>

  <summary class="proof-heading">
    <span class="proof-title">
      {{ include.title | default: "Demostración" }}
    </span>
    <span class="proof-toggle"
          aria-hidden="true"></span>
  </summary>

  <div class="proof-content">
    <div class="proof-body">
      {{ include.content }}
    </div>

    <span class="qed"
          aria-label="Fin de demostración">
      □
    </span>
  </div>

</details>
