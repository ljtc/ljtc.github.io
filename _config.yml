title: "Mi portafolio"
description: "Proyectos, ideas y publicaciones"
url: ""
baseurl: ""
lang: es
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
collections:
  projects:
    output: true
    permalink: /proyectos/:name/
  papers:
    output: true
    permalink: /articulos/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
      math: true
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
