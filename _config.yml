title: "Luis Turcio"
description: "Proyectos, ideas y publicaciones"
url: ""
baseurl: ""
lang: es
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
collections:
  projects:
    output: true
    permalink: /proyectos/:name/
  papers:
    output: true
    permalink: /articulos/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
      math: true
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# numeric, author-year o alphabetic
citation_style: numeric

# giscus
giscus:
  enabled: true
  repo: "ljtc/ljtc.github.io"
  repo_id: "R_kgDOVt3FVw"
  category: "Announcements"
  category_id: "DIC_kwDOVt3FV84DLRat"

